services:
  # Backend Service (Node.js)
  - type: web
    name: job-portal-backend
    env: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # User must provide this in dashboard
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # This blueprint needs a runtime with ClamAV and updated signatures.
      # A bare Node instance without the binary cannot accept production uploads.
      - key: CLAMSCAN_COMMAND
        sync: false


  # AI Service (Python)
  - type: web
    name: job-portal-ai-service
    env: python
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AI_SERVICE_TOKEN
        sync: false
